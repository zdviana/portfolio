spring.application.name=portfolio

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# Health em /api/health (em vez de /actuator/health)
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health

# Origens do front autorizadas (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Lê backend/.env (opcional, ignorado pelo Git) para segredos locais
spring.config.import=optional:file:.env[.properties]
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# O health não deve cair se o SMTP estiver indisponível
management.health.mail.enabled=false
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.to=${MAIL_TO:daviviana.dev@gmail.com}
